name: poor github actions vm

on:
  workflow_dispatch:

jobs:
  normalenv:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make executable
        shell: bash
        run: chmod +x ./f--fetch

      - name: Run f--fetch
        shell: bash
        run: ./f--fetch --verbose

  container:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest

    steps:
      - name: Install dependencies
        run: apk add --no-cache git bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run f--fetch
        shell: bash
        run: |
          chmod +x ./f--fetch
          ./f--fetch --verbose

  vm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Start VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: freebsd
          version: '15.1'
          shell: bash
          run: |
            chmod +x ./f--fetch
            ./f--fetch --verbose
